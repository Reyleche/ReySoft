<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReySoft Splash</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #d8bf8d 0%, #c9ad76 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .shell {
      width: 520px;
      height: 440px;
      position: relative;
      overflow: hidden;
      contain: strict;
      isolation: isolate;
      border-radius: 10px;
    }
    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transform: translateZ(0);
    }
    .triquetra {
      width: 438px;
      height: 438px;
      overflow: visible;
    }

    .leaf {
      fill: none;
      stroke: #120d0a;
      stroke-width: 21;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 760;
      stroke-dashoffset: 760;
      animation: drawLeaf 1.75s cubic-bezier(0.25, 0.85, 0.25, 1) forwards;
      will-change: stroke-dashoffset;
    }
    .l1 { animation-delay: 0.04s; }
    .l2 { animation-delay: 0.24s; }
    .l3 { animation-delay: 0.44s; }

    .badge-pop {
      --from-x: 0px;
      --from-y: 0px;
      opacity: 0;
      transform: translate(var(--from-x), var(--from-y)) scale(0.72);
      transform-origin: center;
      animation: flyFromCenter 0.72s cubic-bezier(0.22, 0.8, 0.2, 1) forwards;
      will-change: transform, opacity;
    }
    .top { animation-delay: 0.98s; }
    .left { animation-delay: 1.12s; }
    .right { animation-delay: 1.26s; }

    .rs-bg {
      fill: #1f2937;
      stroke: #f8e8c0;
      stroke-width: 3;
    }

    .rs-letter {
      fill: #f8e8c0;
      font-size: 30px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .center-badge {
      fill: #111827;
      stroke: #f8e8c0;
      stroke-width: 2.5;
    }

    .center-text {
      fill: #f8e8c0;
      font-size: 19px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    @keyframes drawLeaf {
      0% { stroke-dashoffset: 760; }
      70% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes flyFromCenter {
      0% { opacity: 0; transform: translate(var(--from-x), var(--from-y)) scale(0.72); }
      60% { opacity: 1; }
      100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .leaf, .badge-pop {
        animation: none;
        opacity: 1;
        transform: none;
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="stage">
      <svg class="triquetra" viewBox="0 0 420 420" aria-label="Triqueta ReySoft">
        <!-- Triqueta estilo clásico: 3 hojas puntiagudas -->
        <g transform="translate(210 224)">
          <g>
            <path class="leaf l1" d="M 0 -162 C 94 -102 96 18 0 84 C -96 18 -94 -102 0 -162 Z"></path>
            <path class="leaf l2" d="M 0 -162 C 94 -102 96 18 0 84 C -96 18 -94 -102 0 -162 Z" transform="rotate(120)"></path>
            <path class="leaf l3" d="M 0 -162 C 94 -102 96 18 0 84 C -96 18 -94 -102 0 -162 Z" transform="rotate(240)"></path>

          <!-- Arriba: R -->
            <g transform="translate(0 -98)">
              <g class="badge-pop top" style="--from-x:0px;--from-y:98px;">
                <circle class="rs-bg" r="22"></circle>
                <text class="rs-letter" y="1">R</text>
              </g>
            </g>

          <!-- Izquierda abajo: X -->
            <g transform="translate(-86 56)">
              <g class="badge-pop left" style="--from-x:86px;--from-y:-56px;">
                <circle class="rs-bg" r="22"></circle>
                <text class="rs-letter" y="1">X</text>
              </g>
            </g>

          <!-- Derecha abajo: S -->
            <g transform="translate(86 56)">
              <g class="badge-pop right" style="--from-x:-86px;--from-y:-56px;">
                <circle class="rs-bg" r="22"></circle>
                <text class="rs-letter" y="1">S</text>
              </g>
            </g>

          <!-- Centro: 33 -->
            <g transform="translate(0 -2)">
              <g class="badge-pop" style="--from-x:0px;--from-y:2px;animation-delay:1.40s;">
                <ellipse class="center-badge" rx="24" ry="16"></ellipse>
                <text class="center-text" y="1">33</text>
              </g>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
