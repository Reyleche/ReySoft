<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReySoft Coco y Cana</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #d8bf8d 0%, #c9ad76 100%);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .shell {
      width: 520px;
      height: 520px;
      position: relative;
      overflow: hidden;
      contain: content;
      isolation: isolate;
    }
    .stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      transform: translateZ(0);
    }
    .tri {
      width: 420px;
      height: 420px;
      overflow: visible;
    }
    .loop {
      fill: none;
      stroke: #120d0a;
      stroke-width: 18;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 610;
      stroke-dashoffset: 610;
      animation: draw 1.15s ease-out forwards;
      filter: drop-shadow(0 2px 0 rgba(0, 0, 0, 0.08));
    }
    .l1 { animation-delay: 0.06s; }
    .l2 { animation-delay: 0.18s; }
    .l3 { animation-delay: 0.30s; }

    .badge {
      opacity: 0;
      transform: translateY(8px) scale(0.94);
      transform-origin: center;
      animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.2, 1) forwards;
      will-change: transform, opacity;
    }
    .top { animation-delay: 0.62s; }
    .left { animation-delay: 0.78s; }
    .right { animation-delay: 0.92s; }

    .rs-circle {
      fill: #1f2937;
      stroke: #f8e8c0;
      stroke-width: 4;
    }
    .rs-text {
      fill: #f8e8c0;
      font-size: 44px;
      font-weight: 800;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .brand-plate {
      fill: #fffdf8;
      stroke: #8f7a4f;
      stroke-width: 2;
    }

    @keyframes draw {
      from { stroke-dashoffset: 610; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loop, .badge { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="stage">
      <svg class="tri" viewBox="0 0 420 420" aria-label="Triqueta ReySoft">
        <!-- Triqueta ligera de 3 lazos -->
        <circle class="loop l1" cx="210" cy="118" r="92"></circle>
        <circle class="loop l2" cx="126" cy="266" r="92"></circle>
        <circle class="loop l3" cx="294" cy="266" r="92"></circle>

        <!-- Arista superior: Coco y Cana -->
        <g class="badge top" transform="translate(210 28)">
          <rect class="brand-plate" x="-72" y="-6" rx="16" ry="16" width="144" height="86"></rect>
          <image id="brandLogo" x="-64" y="2" width="128" height="68" preserveAspectRatio="xMidYMid meet"></image>
        </g>

        <!-- Arista inferior izquierda: R -->
        <g class="badge left" transform="translate(92 324)">
          <circle class="rs-circle" r="34"></circle>
          <text class="rs-text" y="1">R</text>
        </g>

        <!-- Arista inferior derecha: S -->
        <g class="badge right" transform="translate(328 324)">
          <circle class="rs-circle" r="34"></circle>
          <text class="rs-text" y="1">S</text>
        </g>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      const logoEl = document.getElementById('brandLogo');
      const params = new URLSearchParams(window.location.search);
      const logoUrl = params.get('logo');
      if (logoEl && logoUrl) {
        logoEl.setAttributeNS('http://www.w3.org/1999/xlink', 'href', logoUrl);
        logoEl.setAttribute('href', logoUrl);
      }
    })();
  </script>
</body>
</html>
